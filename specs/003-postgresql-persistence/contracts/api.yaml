openapi: 3.1.0
info:
  title: HomeFinance API - Persistencia de cuentas y hogares
  version: 1.0.0
  description: >
    Contrato para los flujos existentes de autenticación y configuración del
    hogar con identidad validada por el servidor y almacenamiento persistente.
servers:
  - url: http://localhost:5026
paths:
  /api/auth/register:
    post:
      summary: Registrar una cuenta persistente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Cuenta creada; no incluye contraseña ni hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Solicitud inválida.
        "409":
          description: El correo ya está registrado.
        "503":
          description: Almacenamiento temporalmente no disponible.
  /api/auth/login:
    post:
      summary: Autenticar una cuenta y emitir credencial de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token JWT firmado y datos públicos de la cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Solicitud inválida o credenciales incorrectas.
        "503":
          description: Almacenamiento temporalmente no disponible.
  /api/households:
    get:
      summary: Listar hogares del titular autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hogares cuyo titular es el usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
        "401":
          description: Credencial ausente o inválida.
        "503":
          description: Almacenamiento temporalmente no disponible.
    post:
      summary: Crear un hogar para el titular autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "200":
          description: Hogar creado con el titular tomado de la identidad validada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHouseholdResponse"
        "400":
          description: Nombre inválido.
        "401":
          description: Credencial ausente o inválida.
        "503":
          description: Almacenamiento temporalmente no disponible.
  /api/households/{id}/settings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Consultar configuración del hogar propio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración del hogar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSettings"
        "401":
          description: Credencial ausente o inválida.
        "404":
          description: Hogar inexistente o no perteneciente al usuario autenticado.
        "503":
          description: Almacenamiento temporalmente no disponible.
    put:
      summary: Actualizar configuración del hogar propio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdSettingsRequest"
      responses:
        "200":
          description: Configuración persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateHouseholdResponse"
        "400":
          description: Configuración inválida.
        "401":
          description: Credencial ausente o inválida.
        "404":
          description: Hogar inexistente o no perteneciente al usuario autenticado.
        "503":
          description: Almacenamiento temporalmente no disponible.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      $ref: "#/components/schemas/RegisterRequest"
    AccountResponse:
      type: object
      required: [message, userId, email]
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
    LoginResponse:
      type: object
      required: [message, userId, email, accessToken, expiresAt]
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    CreateHouseholdRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Household:
      type: object
      required: [id, name, ownerId, currency, timeZone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        currency:
          type: string
          example: ARS
        timeZone:
          type: string
          example: America/Argentina/Cordoba
    CreateHouseholdResponse:
      type: object
      required: [message, household]
      properties:
        message:
          type: string
        household:
          $ref: "#/components/schemas/Household"
    HouseholdSettings:
      type: object
      required: [id, name, ownerId, currency, timeZone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        currency:
          type: string
        timeZone:
          type: string
    UpdateHouseholdSettingsRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        timeZone:
          type: [string, "null"]
    UpdateHouseholdResponse:
      type: object
      required: [message, household]
      properties:
        message:
          type: string
        household:
          $ref: "#/components/schemas/Household"
